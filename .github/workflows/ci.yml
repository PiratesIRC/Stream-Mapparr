# GENERATED by _shared/ci/generate_ci.py from release.json and the generator's
# OVERRIDES table. Edit those and re-run the generator; a hand edit here is
# overwritten by the next run. Every action is pinned to a commit SHA: a tag
# is mutable and whoever controls the action repository can move it.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The release job alone asks for more, on itself.
permissions:
  contents: read

# A newer push to the same branch makes the older run's result irrelevant, so
# it is cancelled. Runs on the default branch and on tags are never cancelled:
# each of those is the record of a specific published commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff
      # Every shipped module, found by glob rather than a hand-kept list, which
      # is a list that will be forgotten. `set -e` plus the empty-glob guard means
      # a renamed package directory fails loudly instead of matching nothing.
      - name: Byte-compile every shipped module
        run: |
          set -e
          shopt -s nullglob
          files=(Stream-Mapparr/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "no plugin sources matched Stream-Mapparr/*.py"; exit 1; fi
          printf 'compiling %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
      - name: Version sync (plugin.json == plugin.py)
        run: python scripts/check_version_sync.py
      # The rule families that indicate a genuine defect are a hard gate and were
      # measured at zero before being made one.
      - name: Lint gate (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82
      # The full rule set has a standing backlog here. Gating on it would mean a
      # permanently red CI that everyone learns to ignore, so it is reported and
      # does not fail the build. The house rule is zero net-new findings.
      - name: Lint report (advisory, does not fail the build)
        run: ruff check . --exit-zero --statistics
      - name: "Gate: validate databases"
        run: python scripts/validate_databases.py
      # Guards against a backslash-separator archive (bug-087) in any release zip
      # that happens to be committed. A no-op when none is.
      - name: Validate committed release zip(s)
        run: |
          shopt -s globstar nullglob
          zips=(**/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No committed release zip - skipping."; exit 0; fi
          rc=0
          for z in "${zips[@]}"; do
            echo "::group::$z"; python scripts/validate_zip.py "$z" || rc=1; echo "::endgroup::"
          done
          exit $rc
      - name: Run test suite
        run: python -m pytest -q

  # Second line of defence behind the pre-push hook: applies the repository's
  # deny and allow rules to every tracked file, on the server, where a skipped
  # hook does not apply. The scanner never prints a pattern or a matched string.
  publish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Rules are committed in .publish-audit.json. A PUBLISH_AUDIT_RULES secret,
      # when one is set, takes precedence over the committed file.
      PUBLISH_AUDIT_RULES: ${{ secrets.PUBLISH_AUDIT_RULES }}
      AUDIT_RULES_COMMITTED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan the tracked tree against the repository deny rules
        run: python .github/scripts/publish_audit_ci.py

  # Runs only for a tag, only after every check passed, and is the one job
  # allowed to write. The archive is built from the git index by
  # scripts/build_release_zip.py, never from the worktree, and a failed
  # `gh release create` fails the job: there is no `|| true` here.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, publish-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag is a calver version and matches plugin.json
        id: version
        run: |
          set -euo pipefail
          re='^[0-9]+\.[0-9]{2}\.[0-9]{7}$'
          if ! [[ "$GITHUB_REF_NAME" =~ $re ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Major.YY.DDDHHMM"; exit 1
          fi
          VERSION="${GITHUB_REF_NAME}"
          PLUGIN=$(python -c "import json; print(json.load(open('Stream-Mapparr/plugin.json', encoding='utf-8'))['version'])")
          if [ "$VERSION" != "$PLUGIN" ]; then
            echo "::error::tag version $VERSION does not match plugin.json version $PLUGIN"; exit 1
          fi
          python scripts/check_version_sync.py --tag "$GITHUB_REF_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release $VERSION from tag $GITHUB_REF_NAME"
      - name: Build the archive from the git index
        run: python scripts/build_release_zip.py --ref "$GITHUB_SHA" --out dist
      - name: Validate the archive (forward slashes, package root)
        env:
          ZIP: dist/Stream-Mapparr.zip
        run: |
          set -e
          if [ ! -f "$ZIP" ]; then echo "::error::expected archive $ZIP was not built"; ls -l dist; exit 1; fi
          python scripts/validate_zip.py "$ZIP"
      - name: Extract this version's changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python .github/scripts/release_notes.py --version "$VERSION" \
            --changelog "CHANGELOG.md" --package-dir "Stream-Mapparr" --out dist/notes.md
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; delete it or upload by hand"; exit 1
          fi
      - name: Create the release and attach the archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: dist/Stream-Mapparr.zip
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$VERSION" --notes-file dist/notes.md
          if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx -- "$(basename "$ZIP")"; then
            echo "::error::release created but the asset is not attached"; exit 1
          fi
      - name: Record the asset checksum in the job summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: dist/Stream-Mapparr.zip
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "| Asset | SHA-256 |"
            echo "| --- | --- |"
            echo "| $(basename "$ZIP") | $(sha256sum "$ZIP" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$ZIP"
